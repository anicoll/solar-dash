[package]
name = "solar-dash"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
base64 = "0.23.1"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
ecb = { version = "0.2.1", features = ["alloc"] }
hex = "0.4.3"
rand = "0.8"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rsa = "0.9.10"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3.27.0"
