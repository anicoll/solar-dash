[package]
name = "solar-dash"
version = "0.1.0"
edition = "2024"

[dependencies]
aes = "0.9.3"
anyhow = "1.0.104"
argon2 = "0.6.0"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie-signed"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
ecb = { version = "0.2.1", features = ["alloc"] }
hex = "0.4.3"
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "cookies"] }
rumqttc = { version = "0.25.1", default-features = false }
rpassword = "7.5.4"
rsa = { version = "0.9.10", features = ["sha2"] }
rust-embed = { version = "8.13.0", features = ["mime-guess"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["float_roundtrip"] }
sha2 = "0.11"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "postgres", "migrate", "macros"] }
time = "0.3.55"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "time", "signal", "net"] }
tokio-modbus = { version = "0.17.0", default-features = false, features = ["tcp"] }
toml = "1.1.8"
tower-http = { version = "0.7.1", default-features = false, features = ["compression-gzip", "compression-br"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
hmac = "0.13"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3.27.0"
tokio-modbus = { version = "0.17.0", default-features = false, features = ["tcp-server"] }
tokio = { version = "1.54.0", features = ["test-util"] }
tower = { version = "0.5.3", features = ["util"] }

# The release binary runs 24/7 on a small LXC, so trade build time for a smaller,
# faster binary. `panic` stays at the default (unwind) on purpose: the code
# survives panics in a request or blocking task (JoinError in the login check,
# poisoned locks in modbus.rs), and abort would take the whole service down.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Tests run in the debug profile, where RSA key generation and Argon2 password
# hashing are ~10x slower than in release and dominated the test run. Optimise
# just those crates (and the maths under them); everything else stays debug.
[profile.dev.package]
rsa = { opt-level = 3 }
num-bigint-dig = { opt-level = 3 }
argon2 = { opt-level = 3 }
blake2 = { opt-level = 3 }
