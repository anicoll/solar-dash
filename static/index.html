<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>solar-dash</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <h1>solar-dash</h1>
  <nav class="tabs" aria-label="Views">
    <a class="tab" href="#now" data-view="now">Now</a>
    <a class="tab" href="#day" data-view="day">Day</a>
    <a class="tab" href="#month" data-view="month">Month</a>
    <a class="tab" href="#year" data-view="year">Year</a>
  </nav>
  <form method="post" action="/logout" class="logout">
    <button type="submit" class="btn">Log out</button>
  </form>
</header>

<main>
  <div id="banner" class="banner" role="alert" hidden></div>

  <section id="view-now" class="view" aria-labelledby="h-now" hidden>
    <h2 id="h-now" class="sr-only">Now</h2>
    <p id="updated" class="muted" aria-live="polite">Loading...</p>
    <div class="grid tiles" id="live-tiles"></div>
    <h3 class="section">Today</h3>
    <div class="grid tiles" id="today-tiles"></div>
  </section>

  <section id="view-day" class="view" aria-labelledby="h-day" hidden>
    <h2 id="h-day" class="sr-only">Day</h2>
    <div class="picker">
      <button type="button" class="btn" id="day-prev" aria-label="Previous day">&larr;</button>
      <input type="date" id="day-input" aria-label="Date">
      <button type="button" class="btn" id="day-next" aria-label="Next day">&rarr;</button>
      <button type="button" class="btn" id="day-today">Today</button>
    </div>
    <div class="card">
      <div id="day-chart" class="chart tall" role="img" aria-label="Day chart"></div>
      <p id="day-source" class="source" hidden></p>
      <p id="day-empty" class="empty" hidden>No data for this day</p>
    </div>
    <h3 class="section">Totals</h3>
    <div class="grid tiles" id="day-totals"></div>
  </section>

  <section id="view-month" class="view" aria-labelledby="h-month" hidden>
    <h2 id="h-month" class="sr-only">Month</h2>
    <div class="picker">
      <button type="button" class="btn" id="month-prev" aria-label="Previous month">&larr;</button>
      <input type="month" id="month-input" aria-label="Month">
      <button type="button" class="btn" id="month-next" aria-label="Next month">&rarr;</button>
      <button type="button" class="btn" id="month-today">This month</button>
    </div>
    <div class="card">
      <div id="month-chart" class="chart" role="img" aria-label="Month chart"></div>
      <p id="month-empty" class="empty" hidden>No data for this month</p>
    </div>
    <h3 class="section">Totals</h3>
    <div class="grid tiles" id="month-totals"></div>
  </section>

  <section id="view-year" class="view" aria-labelledby="h-year" hidden>
    <h2 id="h-year" class="sr-only">Year</h2>
    <div class="picker">
      <button type="button" class="btn" id="year-prev" aria-label="Previous year">&larr;</button>
      <input type="number" id="year-input" aria-label="Year" min="2000" max="2100" step="1">
      <button type="button" class="btn" id="year-next" aria-label="Next year">&rarr;</button>
      <button type="button" class="btn" id="year-today">This year</button>
    </div>
    <div class="card">
      <div id="year-chart" class="chart" role="img" aria-label="Year chart"></div>
      <p id="year-empty" class="empty" hidden>No data for this year</p>
    </div>
    <h3 class="section">Totals</h3>
    <div class="grid tiles" id="year-totals"></div>
  </section>
</main>

<!-- ECharts 5.6.0 (Apache-2.0) from cdnjs. To use a local copy instead, change only this tag. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/echarts/5.6.0/echarts.min.js" integrity="sha384-pPi0zxBAoDu6+JXW/C68UZLvBUUtU+7zonhif43rqj7pxsGyqyqzcian2Rj37Rss" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="/static/app.js"></script>
</body>
</html>
