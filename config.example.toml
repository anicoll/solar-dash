# Copy this file to config.toml and fill in your own values.
# config.toml is gitignored, so your secrets stay out of git.

# The site's time zone (IANA name). It decides where a day ends. Optional:
# if unset, `timezone` in [isolarcloud] is used (older configs), else
# "Australia/Adelaide".
[site]
timezone = "Australia/Adelaide"

# Optional. Leave this whole section out to run without iSolarCloud (for
# example with only [modbus]); the cloud sync is then simply off.
[isolarcloud]
# API gateway for your region. The default is the Australian gateway.
gateway = "https://augateway.isolarcloud.com"
# The next three values come from your application's page on the
# iSolarCloud developer portal.
appkey = "YOUR_APPKEY"
# "Access Key", also shown as the secret. Keep this private.
access_key = "YOUR_ACCESS_KEY"
# The RSA public key shown on the same page (used to encrypt the password).
rsa_public_key = "YOUR_RSA_PUBLIC_KEY"
# Whether requests are encrypted. Must match the app's encryption setting in
# the developer portal, or every call will fail.
encrypt = true
# Your normal iSolarCloud login.
username = "you@example.com"
password = "your-password"
# Which plant to sync. Run login-test to list your plants. If unset and you
# have exactly one plant, it is used.
# plant_id = 1234567
# The plant's time zone (IANA name). Prefer [site] timezone above; this is
# only used when [site] has none.
# timezone = "Australia/Adelaide"
# The day your inverter was connected. `serve` fills in the 5-minute history
# from this day in the background, a few days at a time.
# history_from = "2024-01-01"
# Which measuring points `backfill` downloads. Default list and meanings:
#   83033 plant power (W)              83067 PV total active power (W)
#   83106 load power (W)               83328 grid active power (W)
#   83326 ESS (battery) active power (W)   83252 battery SOC (%)
#   83022 plant daily yield (Wh)       83102 energy purchased today (Wh)
#   83072 feed-in energy today (Wh)    83118 daily load consumption (Wh)
#   83322 ESS daily charge (Wh)        83323 ESS daily discharge (Wh)
#   83097 daily PV consumed by loads (Wh)
# points = [83033, 83067, 83106, 83328, 83326, 83252, 83022, 83102, 83072, 83118, 83322, 83323, 83097]

# Optional section; defaults shown.
[server]
bind = "127.0.0.1:8080"
# Password hash for the web dashboard (required for `serve`). Make one with
#   cargo run -- hash-password
# and paste the line it prints here.
# password_hash = "$argon2id$v=19$m=19456,t=2,p=1$..."
# Signs the login cookie: base64 of at least 64 random bytes. Make one with
#   openssl rand -base64 64 | tr -d '\n'; echo
# Required by `serve`: without it the app refuses to start (a random key per
# start would log you out on every restart).
# session_secret = "..."
# Optional: a secret for scripts. With it, `Authorization: Bearer <token>` is
# accepted on /api/ routes as well as the login cookie. At least 32 characters;
# make one with
#   openssl rand -hex 32
# Without it the header is ignored. Keep this file private; it is never logged.
# api_token = "..."
# Adds the `Secure` flag to the login cookie, so browsers only send it over
# https. Leave this true (the default) when you reach the dashboard through
# Cloudflare Tunnel. Set it to false ONLY to test over plain http on your LAN
# (e.g. http://127.0.0.1:8080): browsers drop Secure cookies on http, so
# logins would not stick otherwise.
# cookie_secure = true

# Optional section; defaults shown.
[database]
path = "data/solar.db"
# `serve` copies the database once a day (03:30 in the site time zone ([site] timezone),
# and at startup if today's copy is missing) to <backup_dir>/solar-YYYY-MM-DD.db
# and keeps the newest `backup_keep` files. Default for backup_dir: a `backups`
# folder next to the database file. The user running solar-dash must be able to
# write there. Set backup_keep = 0 to turn backups off.
# backup_dir = "data/backups"
# backup_keep = 14

# Optional: also upload each nightly backup to an S3-compatible bucket such as
# Cloudflare R2, and keep the newest `keep` there (see docs/deploy.md). Without
# this section nothing leaves the machine. Use an API token that can only read
# and write this one bucket.
# [database.offsite]
# account_id = "YOUR_CLOUDFLARE_ACCOUNT_ID"  # or endpoint = "https://..." for another store
# bucket = "solar-dash-backups"
# access_key_id = "YOUR_R2_ACCESS_KEY_ID"
# secret_access_key = "YOUR_R2_SECRET_ACCESS_KEY"
# prefix = "solar-dash/"   # added to every object name
# keep = 15                # newest backups kept in the bucket

# Optional: read live power straight from the inverter over your LAN (Modbus
# TCP). Without this section Modbus is off. To use it, first enable Modbus TCP
# in the WiNet-S dongle's settings (its web page, "Advanced settings"): port
# 502, SSL/TLS off, and the IP whitelist either off or including the machine
# running solar-dash. Test it with `cargo run -- modbus-test --watch`.
# [modbus]
# IP address (or host name) of the WiNet-S dongle. Required in this section.
# host = "192.168.1.60"
# port = 502
# The Modbus unit id.
# unit = 1
# Seconds between reads. The dongle is slow, so don't go much below 5.
# interval_secs = 15

# Optional: show the Tesla's charge state on /api/live. solar-dash reads it
# from TeslaMate's MQTT broker (the one TeslaMate publishes to), so TeslaMate
# must already be running. Without this section the feature is off.
# [teslamate]
# IP address (or host name) of the MQTT broker. Required in this section.
# host = "192.168.1.70"
# port = 1883
# Which car to follow. TeslaMate numbers its cars from 1.
# car_id = 1
# The start of TeslaMate's topic names (its MQTT_NAMESPACE setting).
# topic_prefix = "teslamate"
# Only if the broker needs a login. Give both or neither.
# username = "mqtt-user"
# password = "mqtt-password"
# The petrol price, petrol car, away-charging price and the other settings for
# comparing charging with petrol are edited on the Admin page, not here.
# Optional: copy TeslaMate's whole history (drives and charging sessions of
# every car) from its Postgres database into solar-dash's own, so later views
# can cover more than the live MQTT data. Use a read-only login (see
# docs/how-to-run.md). Without it the history sync is off. The URL holds a
# password, so keep this file private; it is never logged.
# database_url = "postgres://solar_dash:change-me@192.168.1.70:5432/teslamate"

# Optional: your GloBird Energy customer portal login, used by `globird-probe`
# and by `serve`, which keeps GloBird's daily cost and usage in the database
# (read-only access to your account at myaccount.globirdenergy.com.au). The
# password is stored in plain text, so keep this file's mode at 600
# (chmod 600 config.toml). This is an unofficial portal API and may break
# without notice. Without this section the feature is off.
# [globird]
# email = "you@example.com"
# password = "your-portal-password"
# # Local time ("HH:MM", in the site time zone ([site] timezone)) of the daily sync.
# # GloBird's data lags a day or more, so mid-morning is a good time.
# # Default: "09:00".
# sync_time = "09:00"

# Optional: your Amber Electric API token. `amber-probe` uses it to check what
# Amber's API returns for your site, and `serve` uses it to keep the prices in
# the database (every 5 minutes). Read-only: nothing is ever changed at Amber. Create the
# token in the Amber app under Developers. It is a secret stored in plain text,
# so keep this file's mode at 600 (chmod 600 config.toml). Without this section
# the feature is off.
# [amber]
# token = "psk_your-amber-token"
# # Which site (meter) to use. Leave it out if the account has just one site;
# # `amber-probe` lists your sites so you can copy the id of the one you want.
# # site_id = "01F5A5CRKMZ5BCX9P1S4V990AM"
# # Only change this for testing. Default: "https://api.amber.com.au/v1".
# # base_url = "https://api.amber.com.au/v1"
#
# # A tariff plan can be priced from these stored prices instead of fixed
# # windows. Plans are edited on the Admin page ("Price from live prices");
# # in a config file the same thing is a table on the plan:
# # [tariff.dynamic]
# # source = "amber"               # matches the start of the stored source name
# # fee_cents_per_day = 0.0        # retailer fee, added to supply_cents_per_day
# # feed_in_paid_when_negative = true  # Amber reports a NEGATIVE feed-in price
# #                                # when you are paid (confirmed); set false only for a source that
# # # reports it positive
# # The plan's own windows only fill gaps where no price was stored.
#
# # The Bill page's "What would Amber cost?" prices your own usage on a made-up
# # Amber plan from the stored prices. These are placeholders: copy the real
# # figures from your Amber statement. Defaults are shown.
# # [amber.compare]
# # supply_cents_per_day = 100.0
# # fee_cents_per_day = 0.0        # Amber's monthly fee divided by the days
# # feed_in_paid_when_negative = true

# Which source wins when two of them can answer the same question. Optional:
# without this section the defaults below apply, which is how the dashboard
# has always behaved. Today the only such question is a day's energy totals:
# the inverter's live Modbus samples or iSolarCloud's daily counters.
# [sources]
# # Source ids, best first. Valid ids: "sungrow-modbus", "isolarcloud". Leave one
# # out to never use it. Putting "isolarcloud" first makes the cloud counters
# # win whenever they have data; live samples then only fill days it lacks.
# daily_energy = ["sungrow-modbus", "isolarcloud"]
# # A finished day needs this share of its time covered by live samples to
# # win over the cloud counters (0 to 1).
# finished_day_coverage = 0.98
# # Today, or a day the cloud has no data for, needs this share before live
# # samples are used at all. Must not be above finished_day_coverage.
# partial_day_coverage = 0.9

# Electricity tariffs (plans over time), petrol prices, what the system cost
# (purchases), past bills and a few preferences (petrol price and car
# comparison, away charging price, yearly price rise) are no longer set here.
# They are edited on the Admin page of the web UI and kept in the database.
#
# An older config.toml that still has [tariff], [[previous_tariff]],
# [[system.purchase]], [system] price_rise_percent, [bills], the petrol and
# comparison keys of [teslamate] (petrol_cents_per_litre, petrol_litres_per_100km,
# petrol_prices_file, [[teslamate.petrol_price]], compare_cars, petrol_grade,
# away_cents_per_kwh) is imported into the database once, the first time
# `serve` starts. After that those sections are ignored, and `serve` logs a
# warning naming what to delete from config.toml. Old configs keep loading.
